name: Weave Latest Release Build
run-name: Weave Latest Release Build

# MAJ manuelle de la dernière release existante.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weave-release-assets-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      id: ${{ steps.release.outputs.id }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify VERSION and locate the most recently created release
        id: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python firmware/site_scons/tools/check_version.py
          version=$(cat VERSION)
          # Dernière release par ID, drafts et préreleases inclus.
          releases=$(gh api "repos/${GITHUB_REPOSITORY}/releases?per_page=100")
          latest=$(jq -ec 'if length == 0 then error("No GitHub release exists") else max_by(.id) end' <<< "$releases")
          tag=$(jq -er '.tag_name' <<< "$latest")
          id=$(jq -er '.id' <<< "$latest")
          if [[ "$tag" != "v${version}" && "$tag" != "$version" ]]; then
            echo "::error::Newest release has tag '$tag'; expected 'v${version}' or '${version}'. Create the correct release manually first."
            exit 1
          fi
          if [[ $(jq -r '.immutable // false' <<< "$latest") == true ]]; then
            echo "::error::The existing release '$tag' is immutable; its assets cannot be replaced."
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "Targeting existing release: $tag (ID $id)"

  firmware:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check consistent version
        run: python firmware/site_scons/tools/check_version.py
      - name: Install host test dependencies
        run: sudo apt-get update && sudo apt-get install -y libssl-dev
      - name: Security and SDK host regression
        run: |
          python firmware/site_scons/tools/tests/test_security_v4.py
          python firmware/site_scons/tools/tests/test_sdk_release.py
          python firmware/site_scons/tools/tests/test_hardware_wrapper.py
          python firmware/site_scons/tools/tests/test_hal_cleanup.py
      - name: Build firmware only (no companion orchestration loop)
        run: python fbt.py build --firmware-only
      - name: Install and validate the generated SDK with uFBT
        run: |
          python -m pip install ufbt==0.2.6
          python firmware/site_scons/tools/tests/validate_faps.py --sdk build/Weave-1.0.3-sdk.zip
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: |
            build/*.tgz
            build/*-sdk.zip
          if-no-files-found: error

  android:
    needs: preflight
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK (without discontinued tools package)
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android SDK 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check consistent version
        run: python firmware/site_scons/tools/check_version.py
      - name: Android update regression
        run: |
          python firmware/site_scons/tools/tests/test_firmware_update.py
          python firmware/site_scons/tools/tests/test_apk_update.py
      - name: Configure Android signing (optional release keystore)
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WEAVE_ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WEAVE_ANDROID_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.WEAVE_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.WEAVE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          provided=0
          for variable in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -n "${!variable}" ]]; then ((provided+=1)); fi
          done
          if (( provided == 0 )); then
            echo '::warning::Android release-signing secrets are absent; building a debug-signed APK. Debug keys on new runners may differ, so Android upgrades may require reinstalling.'
            echo 'APK_VARIANT=debug' >> "$GITHUB_ENV"
            echo 'Android APK signing: **debug** (development only).' >> "$GITHUB_STEP_SUMMARY"
          elif (( provided == 4 )); then
            printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/weave-release.jks"
            test -s "$RUNNER_TEMP/weave-release.jks"
            chmod 600 "$RUNNER_TEMP/weave-release.jks"
            echo "WEAVE_ANDROID_KEYSTORE=$RUNNER_TEMP/weave-release.jks" >> "$GITHUB_ENV"
            echo 'APK_VARIANT=release' >> "$GITHUB_ENV"
            echo 'Android APK signing: **release**.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo '::error::Android signing secrets are incomplete. Configure all four secrets or remove all four to use a debug-signed APK.'
            exit 1
          fi
      - name: Build Android APK
        working-directory: apps/android
        shell: bash
        env:
          WEAVE_ANDROID_STORE_PASSWORD: ${{ secrets.WEAVE_ANDROID_STORE_PASSWORD }}
          WEAVE_ANDROID_KEY_ALIAS: ${{ secrets.WEAVE_ANDROID_KEY_ALIAS }}
          WEAVE_ANDROID_KEY_PASSWORD: ${{ secrets.WEAVE_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          case "$APK_VARIANT" in
            release) task=':app:assembleRelease' ;;
            debug) task=':app:assembleDebug' ;;
            *) echo '::error::Unknown Android signing variant'; exit 1 ;;
          esac
          python ../../firmware/site_scons/tools/bootstrap_tools.py gradle \
            --no-daemon --gradle-user-home "$RUNNER_TEMP/weave-gradle-cache" "$task"
          apk="$GITHUB_WORKSPACE/build/.work/android/app/outputs/apk/$APK_VARIANT/app-$APK_VARIANT.apk"
          test -s "$apk"
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
      - name: Verify Android APK signature
        shell: bash
        run: |
          set -euo pipefail
          test -s "$APK_PATH"
          apksigner=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -n "$apksigner"
          "$apksigner" verify --verbose --print-certs "$APK_PATH"
      - name: Package Android APK
        run: python firmware/site_scons/tools/release_asset.py android --input "$APK_PATH" --output build
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: build/*.apk
          if-no-files-found: error

  desktop:
    needs: preflight
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
          - os: ubuntu-24.04
            platform: linux
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check consistent version
        shell: bash
        run: python firmware/site_scons/tools/check_version.py
      - name: Install Electron dependencies
        shell: bash
        working-directory: apps/desktop
        run: npm install --prefer-offline --fetch-retries=5 --fetch-retry-mintimeout=2500 --fetch-retry-maxtimeout=10000 --no-audit --no-fund
      - name: Build Electron + Vite application
        shell: bash
        working-directory: apps/desktop
        run: npm run build
      - name: Package desktop application
        shell: bash
        working-directory: apps/desktop
        run: npx electron-builder --publish never --dir --${{ matrix.platform == 'macos' && 'mac' || matrix.platform == 'windows' && 'win' || 'linux' }}
      - name: Locate and ZIP native Electron application
        shell: bash
        run: |
          python firmware/site_scons/tools/package_electron_ci.py --platform '${{ matrix.platform }}' --output build
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}
          path: build/*.zip
          if-no-files-found: error

  publish:
    needs: [preflight, firmware, android, desktop]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Validate all six release assets
        shell: bash
        run: |
          set -euo pipefail
          python firmware/site_scons/tools/check_version.py
          python - <<'PY'
          import sys
          from pathlib import Path
          sys.path.insert(0, str(Path('firmware/site_scons/tools').resolve()))
          from build_all import VERSION, validate_files
          validate_files(Path('release'), VERSION)
          print(f'Validated all six Weave {VERSION} release assets')
          PY
      - name: Replace assets in existing release only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_TAG: ${{ needs.preflight.outputs.tag }}
          TARGET_ID: ${{ needs.preflight.outputs.id }}
        run: |
          set -euo pipefail
          version=$(cat VERSION)
          # Vérif de l’ID avant upload.
          current_id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TARGET_TAG}" --jq '.id')
          if [[ "$current_id" != "$TARGET_ID" ]]; then
            echo '::error::Release changed during the build; refusing to upload assets.'
            exit 1
          fi
          files=(
            "release/Weave-${version}-firmware.tgz"
            "release/Weave-${version}-sdk.zip"
            "release/Weave-${version}-android.apk"
            "release/Weave-${version}-windows.zip"
            "release/Weave-${version}-linux.zip"
            "release/Weave-${version}-macos.zip"
          )
          for file in "${files[@]}"; do test -s "$file"; done
          # Remplace les assets existants (clobber).
          gh release upload "$TARGET_TAG" "${files[@]}" --clobber
          # Nettoyage des anciens assets Weave après upload.
          # Pièces jointes et métadonnées conservées.
          while IFS= read -r asset; do
            if [[ "$asset" =~ ^Weave-[0-9]+\.[0-9]+\.[0-9]+-(firmware\.tgz|android\.apk|(windows|linux|macos|sdk)\.zip)$ ]]; then
              keep=false
              for file in "${files[@]}"; do
                if [[ "$asset" == "${file##*/}" ]]; then keep=true; break; fi
              done
              if [[ "$keep" == false ]]; then
                gh release delete-asset "$TARGET_TAG" "$asset" --yes
              fi
            fi
          done < <(gh release view "$TARGET_TAG" --json assets --jq '.assets[].name')
          echo "Updated existing release $TARGET_TAG with all six Weave $version files."
