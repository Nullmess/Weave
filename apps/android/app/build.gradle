plugins { id 'com.android.application' }

def versionString = rootProject.file('../../VERSION').text.trim()
def parts = versionString.split('\\.').collect { it as int }
if (parts.size() != 3) throw new GradleException('VERSION must use major.minor.patch')

def signingPath = System.getenv('WEAVE_ANDROID_KEYSTORE')

android {
    namespace 'io.github.nullmess.weave'
    compileSdk 35
    buildFeatures { buildConfig true }
    defaultConfig {
        applicationId 'io.github.nullmess.weave'
        minSdk 26
        targetSdk 35
        versionCode (parts[0]*10000 + parts[1]*100 + parts[2])
        versionName versionString
    }
    signingConfigs {
        release {
            if (signingPath) {
                storeFile file(signingPath)
                storePassword System.getenv('WEAVE_ANDROID_STORE_PASSWORD')
                keyAlias System.getenv('WEAVE_ANDROID_KEY_ALIAS')
                keyPassword System.getenv('WEAVE_ANDROID_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (signingPath) signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// GitHub-flavored app descriptions, rendered natively (no remote WebView script).
dependencies {
    implementation 'io.noties.markwon:core:4.6.2'
    implementation 'io.noties.markwon:ext-tables:4.6.2'
    implementation 'io.noties.markwon:ext-strikethrough:4.6.2'
    implementation 'io.noties.markwon:ext-tasklist:4.6.2'
    implementation 'io.noties.markwon:image:4.6.2'
    implementation 'io.noties.markwon:html:4.6.2'
}
